[project]
name = "ha-accelev"
version = "0.1.0"
description = "Home Assistant custom integration for Accelev EV chargers (EVTUN cloud API)"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component",
    "aioresponses",
    "ruff",
    "mypy",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "TID",
]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "."
packages = ["custom_components.accelev"]
